security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        public:
            pattern: ^/api/(games|game|register|createupdategame)
            stateless: true
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/articles, roles: PUBLIC_ACCESS }  
        - { path: ^/api/setups/config, roles: PUBLIC_ACCESS }
        - { path: ^/api/setups, roles: PUBLIC_ACCESS }
        - { path: ^/api/games, roles: PUBLIC_ACCESS }
        - { path: ^/api/game, roles: PUBLIC_ACCESS }
        - { path: ^/api/createupdategame, roles: PUBLIC_ACCESS }
        - { path: ^/api/setups/verify-setup, roles: ROLE_USER }

        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/api/users, roles: ROLE_USER }